<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="학원 급여명세서 관리 포털" />
    <meta name="color-scheme" content="light" />
    <title>학원 급여 포털</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260826-hourly-rate-items-r22" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="./vendor/html2pdf.bundle.min.js" defer></script>
  </head>
  <body>
    <div id="app" aria-live="polite">
      <section id="login-view" class="login-view">
        <div class="login-panel">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">AP</span>
            <div>
              <strong>학원 급여 포털</strong>
              <span>급여 관리</span>
            </div>
          </div>
          <div class="login-copy">
            <h1>급여명세서 확인</h1>
            <p>등록된 Google 계정으로 로그인하세요.</p>
          </div>
          <button id="google-login" class="button button-primary button-wide" type="button">
            <span class="google-g" aria-hidden="true">G</span>
            Google 계정으로 로그인
          </button>
          <div id="demo-login" class="demo-login" hidden>
            <div class="divider"><span>데모 화면 확인</span></div>
            <div class="demo-actions">
              <button class="button button-secondary" type="button" data-demo-role="admin">
                <i data-lucide="shield-check" aria-hidden="true"></i>
                관리자 데모
              </button>
              <button class="button button-secondary" type="button" data-demo-role="teacher">
                <i data-lucide="user-round" aria-hidden="true"></i>
                선생님 데모
              </button>
            </div>
          </div>
          <p id="login-status" class="form-status" role="status"></p>
          <p class="privacy-note"><i data-lucide="lock-keyhole" aria-hidden="true"></i> 승인된 계정만 이용할 수 있습니다.</p>
          <nav class="login-legal-links" aria-label="서비스 정책">
            <a href="./privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>
            <span aria-hidden="true">·</span>
            <a href="./terms.html" target="_blank" rel="noopener">서비스 이용약관</a>
          </nav>
        </div>
        <aside class="login-aside" aria-label="서비스 상태">
          <div class="aside-content">
            <div class="status-seal"><i data-lucide="badge-check" aria-hidden="true"></i></div>
            <p>학원 급여 포털</p>
          </div>
        </aside>
      </section>

      <div id="workspace" class="workspace" hidden>
        <aside class="sidebar">
          <div class="sidebar-brand">
            <span class="brand-mark brand-mark-small" aria-hidden="true">AP</span>
            <div><strong>급여 콘솔</strong><span id="sidebar-academy-name">샘플 학원</span></div>
          </div>
          <nav id="main-nav" class="main-nav" aria-label="주요 메뉴"></nav>
          <div id="assistant-entry" class="sidebar-assistant" hidden>
            <button id="help-nav-button" class="nav-button sidebar-help-button" type="button" data-view="help">
              <i data-lucide="book-open-text" aria-hidden="true"></i>
              <span>사용 설명서</span>
            </button>
            <button id="assistant-toggle" class="assistant-toggle" type="button" aria-controls="assistant-panel" aria-expanded="false">
              <i data-lucide="message-circle-question" aria-hidden="true"></i>
              <span><strong>AI 도움말</strong><small>사용법 질문하기</small></span>
              <i data-lucide="chevron-right" aria-hidden="true"></i>
            </button>
          </div>
          <nav class="sidebar-legal-links" aria-label="서비스 정책">
            <a href="./privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>
            <a href="./terms.html" target="_blank" rel="noopener">이용약관</a>
          </nav>
          <div class="sidebar-user">
            <span id="user-avatar" class="avatar">관</span>
            <div><strong id="user-name">관리자</strong><span id="user-role">관리자</span></div>
            <button id="logout-button" class="icon-button" type="button" title="로그아웃" aria-label="로그아웃">
              <i data-lucide="log-out" aria-hidden="true"></i>
            </button>
          </div>
        </aside>

        <main class="main-content">
          <header class="topbar">
            <button id="mobile-menu" class="icon-button mobile-menu" type="button" title="메뉴 열기" aria-label="메뉴 열기">
              <i data-lucide="menu" aria-hidden="true"></i>
            </button>
            <div>
              <p id="page-eyebrow" class="eyebrow">2026년 8월</p>
              <h1 id="page-title">급여 대시보드</h1>
            </div>
            <div id="topbar-actions" class="topbar-actions"></div>
          </header>
          <div id="page-content" class="page-content"></div>
        </main>
      </div>
    </div>

    <aside id="assistant-panel" class="assistant-panel" role="dialog" aria-modal="false" aria-labelledby="assistant-title" hidden>
      <header class="assistant-header">
        <div>
          <span class="assistant-icon" aria-hidden="true"><i data-lucide="message-circle-question"></i></span>
          <div><h2 id="assistant-title">AI 도움말</h2><p id="assistant-status">내장 사용 설명서</p></div>
        </div>
        <button id="assistant-close" class="icon-button" type="button" title="도움말 닫기" aria-label="도움말 닫기"><i data-lucide="x"></i></button>
      </header>
      <div id="assistant-messages" class="assistant-messages" aria-live="polite"></div>
      <div class="assistant-privacy"><i data-lucide="shield-check" aria-hidden="true"></i><span>이름, 이메일, 전화번호, 계좌번호, 주민번호와 급여액을 입력하지 마세요.</span></div>
      <form id="assistant-form" class="assistant-form">
        <label class="sr-only" for="assistant-input">프로그램 사용법 질문</label>
        <textarea id="assistant-input" rows="2" maxlength="500" placeholder="예: 명세서를 이메일로 보내려면?"></textarea>
        <button class="icon-button assistant-send" type="submit" title="질문 보내기" aria-label="질문 보내기"><i data-lucide="send"></i></button>
      </form>
    </aside>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <script type="module" src="./src/app.js?v=20260826-hourly-rate-items-r22"></script>
  </body>
</html>
